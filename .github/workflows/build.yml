name: Build DVDMaker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dvdmaker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unpack zip if present)
        run: |
          set -e
          SEARCH=.
          ZIP=""
          if [ -f DVDMaker.zip ]; then ZIP=DVDMaker.zip
          elif ls ./*.zip >/dev/null 2>&1; then ZIP=$(ls -1 ./*.zip | head -n1); fi
          if [ -n "$ZIP" ]; then
            rm -rf _src && mkdir _src
            unzip -q -o "$ZIP" -d _src
            SEARCH=_src
          fi
          S=$(find "$SEARCH" -maxdepth 3 -name settings.gradle.kts | head -n1)
          if [ -z "$S" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          echo "APP_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp "${{ env.APP_DIR }}/app/build/outputs/apk/release/app-release.apk" DVDMaker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DVDMaker
          path: DVDMaker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DVDMaker 1.0.${{ github.run_number }}
          body: Автосборка DVDMaker 1.0.${{ github.run_number }}
          files: DVDMaker.apk
          make_
          latest: true
